<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoe — API Reference</title>
  <link rel="icon" type="image/png" href="<!-- ZOE_ICON_PATH -->">
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0e0e0e;
      --bg2: #131313;
      --surface: #191a1a;
      --sur2: #1f2020;
      --sur3: #252626;
      --border: #2a2a2a;
      --bor2: #363636;
      --text: #e7e5e4;
      --text2: #acabaa;
      --text3: #767575;
      --blue: #6a9cff;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
      --purple: #c084fc;
      --sw: 256px;
      --nav-h: 56px;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'Geist Mono', monospace;
    }

    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      scrollbar-width: thin;
      scrollbar-color: var(--sur3) transparent;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bor2);
      border-radius: 4px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #444
    }

    /* ── NAV ──────────────────────────────────────────────────── */
    nav {
      height: var(--nav-h);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: rgba(14, 14, 14, .92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 10px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.5px;
      padding-right: 24px;
      border-right: 1px solid var(--border);
      margin-right: 6px;
      flex-shrink: 0;
    }

    .nav-logo img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: contain
    }

    .nav-links {
      display: flex;
      gap: 0
    }

    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      text-decoration: none;
      padding: 0 14px;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      transition: color .12s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .nav-link:hover {
      color: var(--text)
    }

    .nav-link.active {
      color: var(--text);
      border-bottom-color: var(--text)
    }

    .nav-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .nav-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 11px;
      width: 220px;
      transition: all .14s;
    }

    .nav-search:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(106, 156, 255, .12)
    }

    .nav-search input {
      background: none;
      border: none;
      outline: none;
      font: 13px var(--font);
      color: var(--text);
      width: 100%
    }

    .nav-search input::placeholder {
      color: var(--text3)
    }

    .s-icon {
      color: var(--text3);
      font-size: 14px;
      flex-shrink: 0
    }

    .s-kbd {
      display: flex;
      gap: 2px;
      margin-left: auto
    }

    .kbd {
      font: 10px/1.5 var(--mono);
      color: var(--text3);
      background: var(--sur2);
      border: 1px solid var(--bor2);
      border-radius: 3px;
      padding: 0 4px
    }

    .nav-ver {
      font: 11px var(--mono);
      color: var(--text3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 9px;
      white-space: nowrap
    }

    /* ── SIDEBAR ──────────────────────────────────────────────── */
    .sidebar {
      position: fixed;
      top: var(--nav-h);
      left: 0;
      bottom: 0;
      width: var(--sw);
      overflow-y: auto;
      z-index: 100;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar::-webkit-scrollbar {
      width: 0
    }

    .sb-head {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      background: var(--bg2);
      z-index: 5;
    }

    .sb-title {
      font: 700 13px var(--font);
      color: var(--text);
      letter-spacing: -.2px
    }

    .sb-ver {
      font: 11px var(--mono);
      color: var(--text3);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: .1em
    }

    .sidebar-section-label {
      font: 700 10px/1 var(--font);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(171, 171, 170, .5);
      padding: 20px 16px 7px;
    }

    .sidebar-route {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px 7px 16px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text2);
      border-left: 2px solid transparent;
      transition: all .1s;
      user-select: none;
    }

    .sidebar-route:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .03);
      transform: translateX(2px)
    }

    .sidebar-route.active {
      color: var(--text);
      border-left-color: var(--blue);
      background: rgba(106, 156, 255, .06)
    }

    .method-badge {
      font: 700 9px/1 var(--mono);
      padding: 2px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      letter-spacing: .03em;
    }

    .m-GET {
      background: rgba(106, 156, 255, .15);
      color: #93bbff
    }

    .m-POST {
      background: rgba(74, 222, 128, .12);
      color: #4ade80
    }

    .m-PUT {
      background: rgba(251, 191, 36, .12);
      color: #fbbf24
    }

    .m-PATCH {
      background: rgba(192, 132, 252, .12);
      color: #c084fc
    }

    .m-DELETE {
      background: rgba(248, 113, 113, .12);
      color: #f87171
    }

    .route-path-label {
      font: 12px var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1
    }

    /* ── MAIN ─────────────────────────────────────────────────── */
    .main {
      margin-left: var(--sw);
      margin-top: var(--nav-h);
      height: calc(100vh - var(--nav-h));
      overflow-y: auto;
    }

    .main::-webkit-scrollbar {
      width: 4px
    }

    .main::-webkit-scrollbar-thumb {
      background: var(--bor2);
      border-radius: 4px
    }

    .panel-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0
    }

    /* ── PANELS ───────────────────────────────────────────────── */
    .content-panel {
      display: none
    }

    .content-panel.active {
      display: block
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .animate-in {
      animation: up .18s ease forwards
    }

    /* ── TWO-COLUMN BODY ──────────────────────────────────────── */
    .doc-body {
      display: flex;
      gap: 0;
      align-items: flex-start;
      padding: 0 48px 100px;
    }

    .doc-left {
      flex: 1;
      min-width: 0;
      padding: 40px 48px 40px 0
    }

    .doc-right {
      width: 420px;
      min-width: 420px;
      flex-shrink: 0;
      padding-top: 40px;
      position: sticky;
      top: 0;
      max-height: calc(100vh - var(--nav-h));
      overflow-y: auto;
    }

    .doc-right::-webkit-scrollbar {
      width: 0
    }

    /* ── ROUTE HEADER ─────────────────────────────────────────── */
    .route-header-area {
      padding: 40px 48px 0
    }

    .route-endpoint {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--sur2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      margin-bottom: 18px;
    }

    .route-method {
      font: 700 11px/1 var(--mono);
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: .04em
    }

    .route-path {
      font: 13px var(--mono);
      color: var(--text)
    }

    .route-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1.2px;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .route-desc {
      font-size: 15px;
      color: var(--text2);
      line-height: 1.8;
      max-width: 560px;
      margin-bottom: 16px
    }

    .deprecated-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font: 600 11px var(--font);
      padding: 3px 9px;
      border-radius: 4px;
      background: rgba(251, 191, 36, .1);
      color: var(--yellow);
      border: 1px solid rgba(251, 191, 36, .2)
    }

    .version-badge {
      font: 11px var(--mono);
      color: var(--text3);
      background: var(--sur2);
      border: 1px solid var(--bor2);
      border-radius: 4px;
      padding: 2px 8px;
      display: inline-block
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px
    }

    .tag {
      font: 11px var(--mono);
      padding: 2px 9px;
      border-radius: 20px;
      background: var(--sur2);
      border: 1px solid var(--bor2);
      color: var(--text3)
    }

    /* ── SECTIONS ─────────────────────────────────────────────── */
    .section {
      margin-top: 36px
    }

    .section-label {
      font: 700 11px/1 var(--font);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* ── PARAMS TABLE ─────────────────────────────────────────── */
    .params-table {
      width: 100%;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 10px;
      overflow: hidden;
    }

    .params-table-head {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      gap: 0
    }

    .params-table-head span {
      font: 500 11px var(--font);
      color: var(--text3);
      padding: 10px 16px;
      background: var(--sur2);
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      letter-spacing: .04em;
    }

    .params-table-row {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
    }

    .params-table-row:last-child {
      border-bottom: none
    }

    .params-table-row>div {
      padding: 14px 16px
    }

    .param-name {
      font: 500 13px var(--mono);
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap
    }

    .param-type {
      font: 12px var(--mono);
      color: var(--text3)
    }

    .param-desc {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6
    }

    /* ── FIELD ROWS ───────────────────────────────────────────── */
    .field-row {
      padding: 13px 0;
      border-bottom: 1px solid var(--border)
    }

    .field-row:last-child {
      border-bottom: none
    }

    .field-top {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
      flex-wrap: wrap
    }

    .field-name {
      font: 500 13px var(--mono);
      color: var(--blue)
    }

    .field-name-type {
      font: 12px var(--mono);
      color: var(--text3)
    }

    .field-badge {
      font: 700 10px/1 var(--font);
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px
    }

    .b-req {
      background: rgba(248, 113, 113, .1);
      color: var(--red);
      border: 1px solid rgba(248, 113, 113, .15)
    }

    .b-opt {
      background: rgba(118, 117, 117, .12);
      color: var(--text3);
      border: 1px solid rgba(118, 117, 117, .15)
    }

    .b-gen {
      background: rgba(192, 132, 252, .1);
      color: var(--purple);
      border: 1px solid rgba(192, 132, 252, .15)
    }

    .field-type {
      font: 11px var(--mono);
      color: var(--text3);
      margin-left: auto
    }

    .field-desc {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6
    }

    .validator-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px
    }

    .validator {
      font: 11px var(--mono);
      padding: 2px 7px;
      border-radius: 3px;
      background: var(--sur2);
      border: 1px solid var(--bor2);
      color: var(--text3)
    }

    /* ── SECURITY ─────────────────────────────────────────────── */
    .security-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(192, 132, 252, .07);
      border: 1px solid rgba(192, 132, 252, .18);
      border-radius: 7px;
      padding: 8px 14px;
      font: 600 12px var(--mono);
      color: var(--purple);
    }

    /* ── AUTHOR ───────────────────────────────────────────────── */
    .author-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .author-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6a9cff, #9b72f0);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 700 13px var(--font);
      color: #fff;
      flex-shrink: 0
    }

    .author-name {
      font: 600 13px var(--font);
      color: var(--text)
    }

    .author-meta {
      font-size: 12px;
      color: var(--text3);
      margin-top: 2px
    }

    /* ── LOGIC ────────────────────────────────────────────────── */
    .logic-step {
      display: flex;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border)
    }

    .logic-step:last-child {
      border-bottom: none
    }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(106, 156, 255, .1);
      border: 1px solid rgba(106, 156, 255, .2);
      color: var(--blue);
      font: 700 11px/1 var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px
    }

    .step-what {
      font: 600 13px var(--font);
      color: var(--text);
      margin-bottom: 2px
    }

    .step-how {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.6
    }

    .step-why {
      font-size: 12px;
      color: var(--text3);
      margin-top: 2px;
      font-style: italic
    }

    .logic-notes {
      font-size: 12px;
      color: var(--text3);
      font-style: italic;
      margin-top: 12px;
      padding: 10px 14px;
      border-left: 2px solid var(--bor2);
      line-height: 1.7
    }

    /* ── DEPS ─────────────────────────────────────────────────── */
    .dep-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 7px;
      background: var(--surface);
      margin-top: 5px
    }

    .dep-name {
      font: 500 13px var(--mono);
      color: var(--text)
    }

    .dep-reason {
      font-size: 12px;
      color: var(--text3);
      margin-top: 2px
    }

    /* ── RESPONSE ROWS ────────────────────────────────────────── */
    .response-row {
      padding: 11px 0;
      border-bottom: 1px solid var(--border)
    }

    .response-row:last-child {
      border-bottom: none
    }

    .response-top {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .response-code {
      font: 700 12px var(--mono);
      padding: 3px 8px;
      border-radius: 4px;
      flex-shrink: 0
    }

    .s2xx {
      background: rgba(74, 222, 128, .1);
      color: var(--green);
      border: 1px solid rgba(74, 222, 128, .18)
    }

    .s3xx {
      background: rgba(251, 191, 36, .1);
      color: var(--yellow);
      border: 1px solid rgba(251, 191, 36, .18)
    }

    .s4xx {
      background: rgba(248, 113, 113, .1);
      color: var(--red);
      border: 1px solid rgba(248, 113, 113, .18)
    }

    .s5xx {
      background: rgba(248, 113, 113, .1);
      color: var(--red);
      border: 1px solid rgba(248, 113, 113, .18)
    }

    .response-desc {
      font-size: 13px;
      color: var(--text2)
    }

    /* ── EXAMPLE BLOCKS ───────────────────────────────────────── */
    .example-wrap {
      margin-top: 12px;
      position: relative
    }

    .example-label {
      font: 700 10px/1 var(--font);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px
    }

    .example-block {
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font: 12px/1.85 var(--mono);
      color: #9ba3bc;
      overflow-x: auto;
      white-space: pre;
      box-shadow: 0 0 30px -15px rgba(106, 156, 255, .08);
    }

    .example-block::-webkit-scrollbar {
      height: 3px
    }

    .example-block::-webkit-scrollbar-thumb {
      background: var(--bor2)
    }

    /* ── RIGHT PANEL CARD ─────────────────────────────────────── */
    .right-card {
      background: var(--sur2);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 40px rgba(0, 0, 0, .4);
    }

    .right-card+.right-card {
      margin-top: 14px
    }

    /* ── CODE EXAMPLES ────────────────────────────────────────── */
    .code-examples-box {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
    }

    .code-section-head {
      padding: 14px 18px 0;
    }

    .code-section-title {
      font: 700 11px/1 var(--font);
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 14px
    }

    .code-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      background: var(--sur3);
    }

    .code-tab {
      font: 500 11px var(--font);
      color: var(--text3);
      background: none;
      border: none;
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .1s;
    }

    .code-tab:hover {
      color: var(--text2)
    }

    .code-tab.active {
      color: var(--text);
      border-bottom-color: var(--blue)
    }

    .code-example {
      position: relative
    }

    .code-example-inner {
      position: relative
    }

    .code-copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      font: 500 10px var(--font);
      color: var(--text3);
      background: var(--sur3);
      border: 1px solid var(--bor2);
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      transition: all .12s;
      z-index: 1;
    }

    .code-copy-btn:hover {
      color: var(--text);
      border-color: #555
    }

    .code-copy-btn.copied {
      color: var(--green);
      border-color: rgba(74, 222, 128, .3)
    }

    .code-pre {
      margin: 0;
      padding: 16px;
      font: 12px/1.8 var(--mono);
      color: #b0b8cc;
      overflow-x: auto;
      white-space: pre;
      background: transparent
    }

    .code-pre::-webkit-scrollbar {
      height: 3px
    }

    .code-pre::-webkit-scrollbar-thumb {
      background: var(--bor2)
    }

    .code-content {
      color: #b0b8cc
    }

    /* wrap code-examples-box in right-card */
    .section .code-examples-box {
      border-radius: 0
    }

    /* ── TRY IT OUT ───────────────────────────────────────────── */
    .try-box {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible
    }

    .try-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 18px 12px;
    }

    .try-top-left {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .try-play-btn {
      display: none
    }

    /* hidden — title stands alone in right panel */
    .try-title {
      font: 700 11px/1 var(--font);
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text)
    }

    .try-console-label {
      font-size: 12px;
      color: var(--text2);
      font-family: var(--font);
      text-transform: none;
      letter-spacing: 0
    }

    .try-body {
      padding: 0 18px 12px
    }

    .try-body-label {
      font: 700 10px/1 var(--font);
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px
    }

    .try-path-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--bor2);
      border-radius: 7px;
      padding: 7px 10px;
      transition: border-color .14s;
      margin-bottom: 10px;
    }

    .try-path-row:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(106, 156, 255, .1)
    }

    .try-method-chip {
      font: 700 9px/1 var(--mono);
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0
    }

    .try-path-input {
      background: none;
      border: none;
      outline: none;
      font: 12px var(--mono);
      color: var(--text);
      flex: 1;
      min-width: 0
    }

    .try-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--bor2);
      border-radius: 7px;
      color: var(--text);
      font: 12px/1.6 var(--mono);
      padding: 10px 12px;
      outline: none;
      resize: vertical;
      min-height: 90px;
      transition: border-color .14s;
    }

    .try-textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(106, 156, 255, .1)
    }

    .try-footer {
      padding: 4px 18px 16px
    }

    .try-btn {
      width: 100%;
      padding: 10px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font: 700 13px var(--font);
      cursor: pointer;
      transition: all .14s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .try-btn:hover {
      opacity: .87;
      transform: translateY(-1px)
    }

    .try-btn:active {
      transform: none;
      opacity: .7
    }

    .try-btn.loading {
      opacity: .45;
      pointer-events: none
    }

    /* response */
    .try-response {
      border-top: 1px solid rgba(255, 255, 255, .06);
      padding: 14px 18px
    }

    .try-response-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px
    }

    .try-response-status {
      font: 600 12px var(--mono);
      padding: 4px 10px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .try-response-status.ok {
      background: rgba(74, 222, 128, .1);
      color: var(--green);
      border: 1px solid rgba(74, 222, 128, .2)
    }

    .try-response-status.err {
      background: rgba(248, 113, 113, .1);
      color: var(--red);
      border: 1px solid rgba(248, 113, 113, .2)
    }

    .try-response-status.net {
      background: rgba(251, 191, 36, .1);
      color: var(--yellow);
      border: 1px solid rgba(251, 191, 36, .2)
    }

    .try-response-time {
      font: 11px var(--mono);
      color: var(--text3)
    }

    .try-response-body {
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 13px 14px;
      font: 12px/1.75 var(--mono);
      color: #9ba3bc;
      overflow-x: auto;
      white-space: pre;
      max-height: 260px;
      overflow-y: auto;
      box-shadow: 0 0 20px -10px rgba(106, 156, 255, .08);
    }

    .try-response-body::-webkit-scrollbar {
      width: 3px;
      height: 3px
    }

    .try-response-body::-webkit-scrollbar-thumb {
      background: var(--bor2)
    }

    /* dot */
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0
    }

    .dot-ok {
      background: var(--green);
      box-shadow: 0 0 5px var(--green);
      animation: blink 2s infinite
    }

    .dot-err {
      background: var(--red);
      box-shadow: 0 0 4px var(--red)
    }

    .dot-net {
      background: var(--yellow);
      box-shadow: 0 0 4px var(--yellow)
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .25
      }
    }

    /* wrap right sections in right-card */
    .doc-right .section {
      margin-top: 0
    }

    .doc-right .section+.section {
      margin-top: 14px
    }

    .doc-right .section {
      background: var(--sur2);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 40px rgba(0, 0, 0, .35)
    }

    .doc-right .section .section-label {
      padding: 14px 18px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      margin-bottom: 0;
      font-size: 10px;
      letter-spacing: .15em
    }

    /* ── RESPONSIVE ───────────────────────────────────────────── */
    @media (max-width: 1100px) {
      .doc-right {
        width: 360px;
        min-width: 360px
      }
    }

    @media (max-width: 900px) {
      .doc-body {
        flex-direction: column;
        padding: 0 24px 60px
      }

      .doc-left {
        padding: 32px 0 0
      }

      .doc-right {
        width: 100%;
        min-width: 0;
        position: static;
        max-height: none;
        padding-top: 0
      }

      .sidebar {
        width: 220px
      }

      .nav-links {
        display: none
      }
    }

    @media (max-width: 640px) {
      .sidebar {
        display: none
      }

      .main {
        margin-left: 0
      }

      .doc-body {
        padding: 0 16px 60px
      }

      .route-title {
        font-size: 26px
      }

      .route-header-area {
        padding: 24px 16px 0
      }
    }
  </style>
</head>

<body>

  <nav>
    <a class="nav-logo" href="#">
      <img src="<!-- ZOE_ICON -->" width="24" height="24" alt="Zoe">
      Zoe
    </a>
    <div class="nav-links">
      <a class="nav-link active" href="#">Docs</a>
    </div>
    <div class="nav-right">
      <div class="nav-search">
        <span class="s-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search documentation…" oninput="filterRoutes(this.value)"
          autocomplete="off" />
        <div class="s-kbd"><span class="kbd">⌘</span><span class="kbd">K</span></div>
      </div>
      <span class="nav-ver"><!-- ZOE_VERSION --></span>
    </div>
  </nav>

  <div class="sidebar">
    <div class="sb-head">
      <div class="sb-title"><!-- ZOE_VERSION --></div>
      <div class="sb-ver">API Reference</div>
    </div>
    <!-- ZOE_SIDEBAR -->
  </div>

  <div class="main">
    <div class="panel-inner">
      <!-- ZOE_PANELS -->
    </div>
  </div>

  <script>
    function showRoute(id) {
      document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active', 'animate-in'));
      const panel = document.getElementById('panel-' + id);
      if (panel) {
        panel.classList.add('active');
        void panel.offsetWidth;
        panel.classList.add('animate-in');
        document.querySelector('.main')?.scrollTo({ top: 0, behavior: 'instant' });
      }
      document.querySelectorAll('.sidebar-route').forEach(el => {
        el.classList.remove('active');
        if (el.dataset.rid === String(id)) {
          el.classList.add('active');
          el.scrollIntoView({ block: 'nearest' });
        }
      });
    }

    function filterRoutes(query) {
      const q = query.toLowerCase().trim();
      document.querySelectorAll('.sidebar-route').forEach(el => {
        el.style.display = (!q || el.textContent.toLowerCase().includes(q)) ? 'flex' : 'none';
      });
      document.querySelectorAll('.sidebar-section-label').forEach(lbl => {
        const nxt = lbl.nextElementSibling;
        if (!nxt) return;
        const any = [...nxt.querySelectorAll('.sidebar-route')].some(r => r.style.display !== 'none');
        lbl.style.display = any ? '' : 'none';
      });
    }

    function switchTab(btn, id) {
      const box = btn.closest('.code-examples-box');
      box.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      box.querySelectorAll('.code-example').forEach(el => {
        el.style.display = el.id === tab ? 'block' : 'none';
      });
    }

    function copyCode(targetId) {
      const el = document.getElementById(targetId);
      if (!el) return;
      const text = el.querySelector('.code-content')?.textContent || '';
      navigator.clipboard.writeText(text).then(() => {
        const btn = el.querySelector('.code-copy-btn');
        if (!btn) return;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
      });
    }

    async function executeRequest(rid) {
      const btn = document.getElementById('exec-btn-' + rid);
      const pInp = document.getElementById('try-path-' + rid);
      const bArea = document.getElementById('try-body-' + rid);
      const rArea = document.getElementById('try-response-' + rid);
      const sEl = document.getElementById('try-status-' + rid);
      const tEl = document.getElementById('try-time-' + rid);
      const bEl = document.getElementById('try-response-body-' + rid);
      if (!btn || !pInp) return;

      const method = btn.dataset.method || 'GET';
      const path = pInp.value.trim() || '/';

      btn.classList.add('loading'); btn.textContent = 'Sending…';
      if (rArea) rArea.style.display = 'block';
      if (sEl) { sEl.className = 'try-response-status'; sEl.innerHTML = '<span class="status-dot dot-net"></span> …'; }
      if (tEl) tEl.textContent = '';
      if (bEl) bEl.textContent = '';

      const t0 = performance.now();
      try {
        const opts = { method, headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' } };
        if (bArea && ['POST', 'PUT', 'PATCH'].includes(method)) opts.body = bArea.value;

        const res = await fetch(path, opts);
        const ms = Math.round(performance.now() - t0);
        const ok = res.ok;

        if (sEl) {
          sEl.innerHTML = `<span class="status-dot ${ok ? 'dot-ok' : 'dot-err'}"></span>${res.status} ${res.statusText}`;
          sEl.className = 'try-response-status ' + (ok ? 'ok' : 'err');
        }
        if (tEl) tEl.textContent = ms + 'ms';

        const ct = res.headers.get('content-type') || '';
        let txt;
        if (ct.includes('application/json')) {
          try { txt = JSON.stringify(await res.json(), null, 2); } catch { txt = await res.text(); }
        } else { txt = await res.text(); }
        if (bEl) bEl.textContent = txt || '(empty)';

      } catch (e) {
        const ms = Math.round(performance.now() - t0);
        if (sEl) { sEl.innerHTML = `<span class="status-dot dot-net"></span>Network Error`; sEl.className = 'try-response-status net'; }
        if (tEl) tEl.textContent = ms + 'ms';
        if (bEl) bEl.textContent = String(e);
      } finally {
        btn.classList.remove('loading'); btn.textContent = 'Send Request →';
      }
    }

    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault(); document.getElementById('searchInput')?.focus();
      }
      if (e.key === 'Escape' && document.activeElement?.id === 'searchInput') {
        document.getElementById('searchInput').value = '';
        filterRoutes('');
        document.getElementById('searchInput').blur();
      }
    });
  </script>
</body>

</html>
